<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>শিখি অনলাইন | Shikhi Online</title>
<meta name="description" content="বাংলা শিক্ষামূলক ভিডিও, অনলাইন ক্লাস, স্পোকেন ইংলিশ, ফ্রিল্যান্সিং ও পরীক্ষার প্রস্তুতি। Bangla educational videos, online classes, spoken English and freelancing.">
<meta name="theme-color" content="#0f2a5e">
<meta property="og:title" content="Shikhi Online | শিখি অনলাইন">
<meta property="og:description" content="শিখি সহজে, এগিয়ে চলি — Learn easy, move ahead.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23123a82' stroke='%23ffb400' stroke-width='5'/%3E%3Cpath d='M42 22l24 13-24 13z' fill='%23ffb400'/%3E%3Cpath d='M20 58q15-6 30 2q15-8 30-2v24q-15-6-30 2q-15-8-30-2z' fill='%232fc4b7'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&family=Poppins:wght@600;700&display=swap">
<style>
:root{--bg:#f4f7fc;--surface:#fff;--text:#12254d;--muted:#51618a;--line:#d9e1f2;--navy:#0f2a5e;--gold:#ffb400;--teal:#2fc4b7;--blue:#2f5bea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1a3d;--surface:#102a5c;--text:#eef3ff;--muted:#a9b8dc;--line:#24407a}}
:root[data-theme="dark"]{--bg:#0a1a3d;--surface:#102a5c;--text:#eef3ff;--muted:#a9b8dc;--line:#24407a}
html{scroll-behavior:smooth;scroll-padding-top:70px}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.7 "Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.en{font-family:Poppins,"Hind Siliguri",sans-serif}
/* header */
header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding-top:env(safe-area-inset-top,0px)}
header .wrap{display:flex;align-items:center;gap:12px;height:60px;position:relative}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;white-space:nowrap;margin-right:6px}
.brand svg{width:34px;height:34px}
nav{display:flex;gap:16px;font-size:15px;margin-right:auto}
nav a{text-decoration:none;opacity:.85;white-space:nowrap;padding:4px 0;border-bottom:2px solid transparent}
nav a:hover,nav a:focus-visible,nav a.on{opacity:1;color:var(--gold);border-color:var(--gold)}
.hs{display:flex;align-items:center;background:rgba(255,255,255,.12);border-radius:999px;padding:0 4px 0 14px;border:1.5px solid rgba(255,255,255,.25)}
.hs input{background:none;border:0;color:#fff;padding:6px 4px;width:150px;border-radius:0;font-size:14px}
.hs input::placeholder{color:#c6d3f2}
.hs button{background:none;border:0;color:#fff;cursor:pointer;font-size:16px;padding:4px 8px}
.ib{font:inherit;font-size:14px;font-weight:700;background:none;color:#fff;border:1.5px solid rgba(255,255,255,.5);border-radius:999px;padding:4px 12px;cursor:pointer}
#dots{display:none}
#menu{position:absolute;right:16px;top:calc(58px + env(safe-area-inset-top,0px));background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:6px;min-width:230px;box-shadow:0 10px 30px rgba(0,0,0,.3);max-height:75vh;overflow:auto}
#menu[hidden]{display:none}
#menu button,#menu a{display:block;width:100%;text-align:left;font:inherit;background:none;border:0;color:inherit;padding:10px 12px;border-radius:8px;cursor:pointer;text-decoration:none}
#menu button:hover,#menu a:hover{background:var(--bg)}
.mn{display:none!important}
.own-only{display:none!important}
html.own .own-only{display:block!important}
html.own #dots{display:inline-block}
/* app banner */
#appbar{background:linear-gradient(90deg,#2f5bea,#2fb4e8);color:#fff;font-size:15px}
#appbar .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
#appbar span{flex:1;line-height:1.4}
#appbar a{background:#fff;color:#2f5bea;font-weight:700;text-decoration:none;border-radius:8px;padding:6px 16px;white-space:nowrap}
#appbar button{background:none;border:0;color:#fff;font-size:20px;cursor:pointer;padding:0 4px}
/* hero slider */
.slider{position:relative;overflow:hidden;color:#fff;min-height:440px}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .6s,visibility .6s;display:flex;align-items:center}
.slide.on{opacity:1;visibility:visible;position:relative}
.slide .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:32px;align-items:center;width:100%;padding-top:56px;padding-bottom:84px}
.s0{background:radial-gradient(circle at 75% 30%,#1c4da0 0,#0f2a5e 55%,#0a1d45 100%)}
.s1{background:radial-gradient(circle at 75% 30%,#14857d 0,#0f4f6b 55%,#0a2a45 100%)}
.s2{background:radial-gradient(circle at 75% 30%,#6a3fc4 0,#33216e 55%,#1a1240 100%)}
.s3{background:radial-gradient(circle at 75% 30%,#d2691e 0,#8a3a14 55%,#3d1a0a 100%)}
.slide h1{margin:0 0 6px;font-size:clamp(34px,7vw,64px);line-height:1.1}
.tag{font-size:clamp(22px,3.6vw,34px);font-weight:700;color:var(--gold);margin:0 0 14px}
.slide p.d{max-width:48ch;color:#e0e8fb;margin:0 0 26px}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-block;padding:12px 26px;border-radius:999px;font:inherit;font-weight:700;text-decoration:none;border:2px solid var(--gold);cursor:pointer;color:#fff;background:none}
.btn.gold{background:var(--gold);color:#0f2a5e}
.btn.sm{padding:7px 18px;font-size:15px}
.logo{width:min(100%,280px);justify-self:center}
.emoji{font-size:clamp(100px,18vw,190px);text-align:center;line-height:1;filter:drop-shadow(0 12px 24px rgba(0,0,0,.35))}
.sc{position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:center;align-items:center;gap:10px;z-index:2}
.sc button{border:0;cursor:pointer}
.sc .ar{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font-size:18px}
.sc .dt{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.4);padding:0}
.sc .dt[aria-current="true"]{width:28px;border-radius:6px;background:var(--gold)}
/* sections */
section{padding:56px 0}
.eyebrow{display:table;margin:0 auto 10px;font-size:13px;padding:2px 16px;border-radius:999px;border:1.5px solid var(--blue);color:var(--blue);background:var(--surface)}
.ttl{text-align:center;font-size:clamp(28px,5vw,44px);margin:0 0 8px;line-height:1.25;font-weight:700}
.ttl b{background:linear-gradient(90deg,#2f5bea,#2fc4b7);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:var(--muted);margin:0 auto 32px;max-width:60ch}
h2{font-size:clamp(26px,4vw,36px);margin:0 0 8px;line-height:1.25}
.lead{color:var(--muted);margin:0 0 28px;max-width:58ch}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:18px}
input,select,textarea{font:inherit;font-size:16px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);width:100%}
.tools input{max-width:340px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 26px}
.chip{font:inherit;font-size:15px;padding:7px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#0f2a5e;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#0f2a5e}
.card video{width:100%;max-height:440px;aspect-ratio:16/9;object-fit:contain;background:#000;display:block}
.card .b{padding:16px 18px 18px}
.badge{display:inline-block;font-size:13px;padding:1px 12px;border-radius:999px;background:var(--teal);color:#06302c;font-weight:700;margin-right:6px}
.badge.t{background:var(--gold);color:#0f2a5e}
.card h3{margin:10px 0 6px;font-size:19px;line-height:1.4}
.card p{margin:0 0 10px;color:var(--muted);font-size:16px}
.mini{font:inherit;font-size:14px;padding:5px 14px;border-radius:999px;border:1.5px solid var(--teal);background:none;color:var(--text);cursor:pointer;text-decoration:none;display:inline-block}
.empty{padding:34px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}
/* category cards */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.cat{background:var(--surface);border:2px solid var(--c);border-radius:16px;overflow:hidden;cursor:pointer;text-align:left;font:inherit;color:inherit;padding:0;transition:transform .2s,box-shadow .2s}
.cat:hover,.cat:focus-visible{transform:translateY(-4px);box-shadow:0 10px 24px rgba(15,42,94,.18)}
.cat .im{height:110px;display:flex;align-items:center;justify-content:center;font-size:56px;background:linear-gradient(135deg,var(--c),#0f2a5e)}
.cat .tx{padding:12px 16px 14px}
.cat h3{margin:0 0 2px;font-size:18px}
.cat p{margin:0 0 8px;font-size:14px;color:var(--muted);line-height:1.5}
.cat small{font-size:13px;color:var(--muted)}
/* notice */
.nbox{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--blue);border-radius:16px;overflow:hidden}
.nh,.nr{display:grid;grid-template-columns:1fr 130px;gap:12px;padding:14px 20px;align-items:center}
.nh{background:var(--bg);font-weight:700;font-size:15px}
.nr{border-top:1px solid var(--line)}
.nr b{display:block}
.nr small{color:var(--muted)}
.nr .dt2{color:var(--muted);font-size:15px}
.new{display:inline-block;background:#ff5a5f;color:#fff;font-size:12px;border-radius:999px;padding:0 10px;margin-right:8px}
/* store */
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px;justify-content:center}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;position:relative}
.prod .im{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:80px;background:linear-gradient(135deg,#1d4fa3,#0c1f4d);overflow:hidden}
.prod .im img{width:100%;height:100%;object-fit:cover}
.prod .off{position:absolute;left:10px;top:10px;background:#e0243b;color:#fff;font-weight:700;font-size:13px;border-radius:999px;padding:2px 10px}
.prod .pb{padding:14px 16px 16px}
.prod h3{margin:0 0 8px;font-size:17px;line-height:1.4}
.prod .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.old{display:block;text-decoration:line-through;color:var(--muted);font-size:13px;line-height:1.2}
.pr{font-weight:700;color:#e0243b;font-size:20px;line-height:1.2}
.buy{background:var(--navy);color:#fff;border-radius:999px;padding:7px 18px;text-decoration:none;font-weight:700;font-size:15px}
.more{text-align:center;margin-top:26px}
.more a{display:inline-block;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 22px;text-decoration:none;font-size:15px}
/* team */
.team{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.mem{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;text-align:center;box-shadow:0 4px 14px rgba(15,42,94,.08)}
.mem .av{width:104px;height:104px;border-radius:18px;margin:0 auto 12px;background:linear-gradient(135deg,#2f5bea,#2fc4b7);display:flex;align-items:center;justify-content:center;font-size:44px;color:#fff;overflow:hidden}
.mem .av img{width:100%;height:100%;object-fit:cover}
.mem h3{margin:0;font-size:19px;color:var(--blue)}
.mem small{color:var(--muted)}
.mem .sl{display:flex;gap:10px;justify-content:center;margin-top:10px}
.mem .sl a{font-size:14px;color:var(--muted)}
/* tools (cgpa / archive / suggestion) */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;max-width:760px;margin:0 auto}
.cg{display:grid;grid-template-columns:1.6fr 1fr 1fr 40px;gap:10px;margin-bottom:10px;align-items:center}
.cg .x{border:0;background:none;color:#e0243b;font-size:22px;cursor:pointer}
.res{margin-top:16px;padding:16px;border-radius:14px;background:var(--bg);display:flex;gap:20px;flex-wrap:wrap;justify-content:space-around;text-align:center}
.res b{display:block;font-size:30px;color:var(--blue);line-height:1.2}
.res span{font-size:14px;color:var(--muted)}
.arch a{display:flex;justify-content:space-between;gap:10px;padding:12px 4px;border-top:1px solid var(--line);text-decoration:none}
.arch a:first-child{border-top:0}
/* faq */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface)}
.item{padding:24px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.item h3{margin:0 0 6px;font-size:20px}
.item p{margin:0;color:var(--muted);font-size:16px}
details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:12px}
summary{cursor:pointer;font-weight:700}
details p{margin:8px 0 0;color:var(--muted)}
/* contact */
.cbox{background:var(--surface);border:1px solid var(--line);border-radius:22px;display:grid;grid-template-columns:1fr 1.2fr;overflow:hidden;box-shadow:0 8px 28px rgba(15,42,94,.08)}
.cbox>div{padding:30px}
.cbox>div+div{border-left:1px solid var(--line)}
.cbox h3{margin:0 0 6px;font-size:22px;color:var(--blue)}
.ci{display:flex;gap:14px;align-items:center;margin:18px 0}
.ci i{font-style:normal;width:42px;height:42px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.ci small{display:block;color:var(--muted);line-height:1.2}
.ci a{font-weight:700;font-size:18px;text-decoration:none;color:var(--blue);word-break:break-all}
form.c{display:grid;gap:12px}
.cta{background:var(--navy);color:#fff;border-radius:24px;padding:44px 24px;text-align:center}
.cta p{color:#d4def5;max-width:50ch;margin:0 auto 22px}
/* footer */
footer{background:var(--surface);border-top:1px solid var(--line);padding:36px 0 24px;color:var(--muted);font-size:15px}
.fg{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:28px}
footer h4{margin:0 0 10px;color:var(--text);font-size:18px}
footer ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
footer .cl{display:grid;gap:6px}
footer a{text-decoration:none}
footer a:hover{color:var(--blue)}
footer .cp{text-align:center;border-top:1px solid var(--line);margin-top:24px;padding-top:16px;font-size:14px}
footer button{font:inherit;background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer}
dialog{max-width:560px;width:calc(100% - 32px);border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--text);padding:24px}
dialog::backdrop{background:rgba(0,0,0,.55)}
#upd{max-width:600px}
#top2{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;border:0;background:var(--gold);color:#0f2a5e;font-size:20px;font-weight:700;cursor:pointer;display:none;z-index:15}
#fab{display:none;position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;border:0;border-radius:999px;background:var(--blue);color:#fff;font:inherit;font-weight:700;padding:12px 20px;box-shadow:0 6px 18px rgba(0,0,0,.3);cursor:pointer}
html.own #fab{display:block}
.gl{display:none!important}
.lockbox{max-width:560px;margin:0 auto;text-align:center;background:var(--surface);border:1.5px dashed var(--blue);border-radius:20px;padding:34px 22px}
.lockbox .ic{font-size:44px;line-height:1.2}
.lockbox h3{margin:6px 0 4px;font-size:22px}
.lockbox p{margin:0 0 18px;color:var(--muted)}
#auth{max-width:420px}
#auth .tabs{display:flex;gap:10px;margin-bottom:16px}
.af{display:grid;gap:10px}
.af[hidden],#aProf[hidden]{display:none}
#am{margin:10px 0 0;color:#e0243b;min-height:1.4em;font-size:15px}
#am.ok{color:#14a37f}
#adm{display:none;background:var(--surface);border:1.5px dashed var(--teal);border-radius:18px;padding:20px;margin-bottom:28px}
#adm .g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.btn:focus-visible,a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
@media (max-width:1080px){
 nav,.hs,#au{display:none}
 .brand{margin-right:auto}
 #dots{display:inline-block}
 .mn{display:block!important}
}
@media (max-width:760px){
 .slide .wrap,#adm .g,.cbox,.fg{grid-template-columns:1fr}
 .cbox>div+div{border-left:0;border-top:1px solid var(--line)}
 .logo{width:130px;justify-self:start;order:-1}
 .emoji{font-size:90px;text-align:left;order:-1}
 .slider{min-height:0}
 section{padding:44px 0}
 .nh,.nr{grid-template-columns:1fr 92px;padding:12px 14px}
 .cg{grid-template-columns:1fr 1fr 40px}.cg .nm{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.slide{transition:none}}
</style>
</head>

<header>
 <div class="wrap">
  <a class="brand" href="#top"><svg><use href="#lg"/></svg><span class="en">Shikhi Online</span></a>
  <nav id="nav"></nav>
  <form class="hs" id="hs" role="search"><input id="hq" type="search" data-ph="hsearch" aria-label="Search"><button type="submit" aria-label="Search">⌕</button></form>
  <button class="ib" id="lang" type="button" aria-label="Language">EN</button>
  <button class="ib" id="th" type="button" aria-label="Theme">◐</button>
  <button class="ib" id="au" type="button" style="background:var(--gold);color:#0f2a5e;border-color:var(--gold)"></button>
  <button class="ib" id="dots" type="button" aria-label="Menu" aria-haspopup="true">☰</button>
  <div id="menu" hidden><span id="mnav"></span><button type="button" id="mau" class="mn" style="font-weight:700"></button><button type="button" id="m1" class="own-only" data-i="up"></button><button type="button" id="m2" class="own-only" data-i="set"></button><button type="button" id="m3" class="own-only" data-i="exitO"></button></div>
 </div>
</header>

<div id="appbar"><div class="wrap"><span data-i="bar"></span><a data-yt data-i="subShort" target="_blank" rel="noopener"></a><button type="button" id="barx" aria-label="Close">×</button></div></div>

<main id="top">
 <div class="slider" id="slider" aria-roledescription="carousel"></div>

 <section id="categories"><div class="wrap">
  <span class="eyebrow" data-i="eCat"></span>
  <h2 class="ttl" id="tCat"></h2><p class="sub" data-i="lCat"></p>

/* ---------- মালিকের আপলোড (আগের মতোই) ---------- */
let REMOTE=[],LOCAL=[];const ALL=()=>CONTENT.concat(REMOTE,LOCAL);
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open("shikhi",1);r.onupgradeneeded=()=>r.result.createObjectStore("v",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function idbDo(mode,fn){const d=await idb();return new Promise((res,rej)=>{const tx=d.transaction("v",mode),q=fn(tx.objectStore("v"));tx.oncomplete=()=>res(q&&q.result);tx.onerror=()=>rej(tx.error)})}
async function loadLocal(){try{const rows=await idbDo("readonly",s=>s.getAll());LOCAL=(rows||[]).map(r=>{const u=r.blob?URL.createObjectURL(r.blob):"";return{...r,blob:undefined,lid:r.id,vurl:r.type==="video"?u:"",img:r.type==="post"?u:""}});cards()}catch(e){}}
async function loadRemote(){try{const r=await fetch("content.json",{cache:"no-store"});if(r.ok){REMOTE=await r.json();cards()}}catch(e){}}
let S={};try{S=JSON.parse(localStorage.getItem("gh")||"{}")}catch(e){}
$("ur").value=S.repo||"";$("ut2").value=S.tok||"";
$("ur").oninput=$("ut2").oninput=()=>{S={repo:$("ur").value.trim(),tok:$("ut2").value.trim()};try{localStorage.setItem("gh",JSON.stringify(S))}catch(e){}};
const api=p=>"https://api.github.com/repos/"+S.repo+"/contents/"+p;
const hd=()=>({Authorization:"Bearer "+S.tok,Accept:"application/vnd.github+json"});
async function gh(p,b){const r=await fetch(api(p),{method:"PUT",headers:hd(),body:JSON.stringify(b)});if(!r.ok){let m="";try{m=(await r.json()).message}catch(e){}throw new Error("GitHub "+r.status+": "+m)}}
const b64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(f)});
const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o,null,1))));
$("dots").onclick=e=>{e.stopPropagation();$("menu").hidden=!$("menu").hidden};
document.addEventListener("click",e=>{if(!e.target.closest("#menu"))$("menu").hidden=true});
function openUp(sett){if(!OWN())return;$("menu").hidden=true;$("um").textContent="";$("uset").open=!!sett;$("upd").showModal()}
$("m3").onclick=()=>{try{localStorage.removeItem("owner")}catch(e){}location.reload()};$("m1").onclick=()=>openUp(false);$("m2").onclick=()=>openUp(true);$("uc2").onclick=()=>$("upd").close();
$("ut").onchange=()=>{$("uf").accept=$("ut").value==="video"?"video/*":"image/*"};
async function doUpload(mode){if(!OWN())return;const m=$("um"),type=$("ut").value,cat=$("uc").value,title=$("utt").value.trim(),body=$("ub").value.trim(),yt=$("uy").value.trim(),f=$("uf").files[0];
 if(!title){m.textContent=t("needT");return}
 if(!f&&!yt){m.textContent=t("needF");return}
 const rec={type,cat,title,date:new Date().toISOString().slice(0,10)};if(body)rec.body=body;if(yt)rec.yt=yt;
 $("pub").disabled=$("loc").disabled=true;m.textContent=t("wait");
 try{
  if(mode==="loc"){rec.id="l"+Date.now();rec.blob=f||null;await idbDo("readwrite",s=>s.put(rec));await loadLocal()}
  else{if(!S.repo||!S.tok)throw new Error(t("needS"));if(f&&f.size>50*1048576)throw new Error(t("big"));
   if(f){const ext=(f.name.split(".").pop()||"bin").replace(/\W/g,"");const path="uploads/"+Date.now()+"."+ext;await gh(path,{message:"Add "+title,content:await b64(f)});rec.file=path}
   let sha,arr=[];const g=await fetch(api("content.json"),{headers:hd()});
   if(g.ok){const j=await g.json();sha=j.sha;arr=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,"")))))}
   arr.push(rec);await gh("content.json",{message:"Update content",content:enc(arr),sha});REMOTE=arr}
  cur=cat;$("q").value="";cards();$("upd").close();["uf","utt","ub","uy"].forEach(k=>$(k).value="");location.hash="#content"
 }catch(e){m.textContent=(e&&e.message)||t("err")}
 $("pub").disabled=$("loc").disabled=false}
/* ---------- লগইন / সাইন আপ (এই ডিভাইসের ব্রাউজারে) ---------- */
const getU=()=>{try{return JSON.parse(localStorage.getItem("users")||"{}")}catch(e){return{}}};
const putU=o=>localStorage.setItem("users",JSON.stringify(o));
const me=()=>{try{const s=localStorage.getItem("sess"),u=getU()[s];return u?{email:s,name:u.name}:null}catch(e){return null}};
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
async function hashPw(p,salt){if(!window.crypto||!crypto.subtle)throw new Error(t("aSecure"));const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveBits"]);return hex(await crypto.subtle.deriveBits({name:"PBKDF2",salt:new TextEncoder().encode(salt),iterations:100000,hash:"SHA-256"},k,256))}
/* লগইন ছাড়া যে অংশগুলো লক থাকবে (বাদ দিতে চাইলে তালিকা থেকে মুছুন) */
const GATE=["content","store","archive","cgpa","suggest"];
function gate(){const ok=!!me()||OWN();
 GATE.forEach(id=>{const w=$(id).querySelector(".wrap");w.querySelectorAll(":scope>.lockbox").forEach(x=>x.remove());
  [...w.children].forEach((c,i)=>{if(i>=3&&!c.classList.contains("lockbox"))c.classList.toggle("gl",!ok)});
  if(!ok){const b=el("div","lockbox");b.append(el("div","ic","🔒"),el("h3",0,t("lockT")),el("p",0,t("lockD")));const x=el("button","btn gold",t("login")+" / "+t("signup"));x.type="button";x.onclick=openAuth;b.appendChild(x);w.insertBefore(b,w.children[3])}})}
function authLabels(){const u=me(),s=u?"👤 "+u.name.split(" ")[0]:t("login");$("au").textContent=s;$("mau").textContent=s;gate()}
function authView(v){const u=me();if(u)v="prof";$("aLogin").hidden=v!=="login";$("aSign").hidden=v!=="sign";$("aProf").hidden=v!=="prof";$("atabs").hidden=v==="prof";
 $("tl").setAttribute("aria-pressed",String(v==="login"));$("ts").setAttribute("aria-pressed",String(v==="sign"));
 if(u){$("pn").textContent=u.name;$("pe").textContent=u.email}$("am").textContent="";$("am").className=""}
function openAuth(){$("menu").hidden=true;authView("login");$("auth").showModal()}
$("au").onclick=$("mau").onclick=openAuth;$("ax").onclick=()=>$("auth").close();
$("tl").onclick=()=>authView("login");$("ts").onclick=()=>authView("sign");
$("lo").onclick=()=>{try{localStorage.removeItem("sess")}catch(e){}authLabels();$("auth").close()};
$("aSign").onsubmit=async e=>{e.preventDefault();const m=$("am");m.className="";
 const name=$("sn2").value.trim(),em=$("se").value.trim().toLowerCase(),p=$("sp").value;
 if(p.length<6){m.textContent=t("aShort");return}if(p!==$("sp2").value){m.textContent=t("aMatch");return}
 const us=getU();if(us[em]){m.textContent=t("aExists");return}
 try{const salt=hex(crypto.getRandomValues(new Uint8Array(16)));us[em]={name,salt,hash:await hashPw(p,salt)};putU(us);localStorage.setItem("sess",em);authLabels();authView("prof");m.textContent=t("aOkS");m.className="ok";e.target.reset()}catch(x){m.textContent=x.message||t("err")}};
$("aLogin").onsubmit=async e=>{e.preventDefault();const m=$("am");m.className="";const em=$("le").value.trim().toLowerCase(),u=getU()[em];
 try{if(!u||await hashPw($("lp").value,u.salt)!==u.hash){m.textContent=t("aBad");return}localStorage.setItem("sess",em);authLabels();authView("prof");e.target.reset()}catch(x){m.textContent=x.message||t("err")}};
$("fab").onclick=()=>openUp(false);

loadLocal();loadRemote();
